workflows:
  opaque-icon-themer:
    name: OpaqueIconThemer IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      events: []
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          xcodegen generate
      - name: Build unsigned iOS app
        script: |
          set -euo pipefail
          rm -rf "$CM_BUILD_DIR/build"
          xcodebuild \
            -project OpaqueIconThemer.xcodeproj \
            -scheme OpaqueIconThemer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Pack unsigned IPA and ZIP
        script: |
          set -euo pipefail
          APP="$(find "$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          rm -rf "$CM_BUILD_DIR/build/Payload"
          mkdir -p "$CM_BUILD_DIR/build/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/Payload/"
          cd "$CM_BUILD_DIR/build"
          zip -qry OpaqueIconThemer.ipa Payload
          rm -f OpaqueIconThemer-IPA.zip
          zip -q OpaqueIconThemer-IPA.zip OpaqueIconThemer.ipa
          ls -lh OpaqueIconThemer.ipa OpaqueIconThemer-IPA.zip
    artifacts:
      - build/OpaqueIconThemer-IPA.zip
      - build/OpaqueIconThemer.ipa
