name: Build OpaqueIconThemer

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build manager
        run: |
          set -euo pipefail
          xcodebuild \
            -project OpaqueIconThemer.xcodeproj \
            -scheme OpaqueIconThemer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Pack IPA
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry OpaqueIconThemer.ipa Payload

      - name: Build SpringBoard bridge
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -fobjc-arc \
            -dynamiclib \
            -arch arm64 \
            -arch arm64e \
            -miphoneos-version-min=16.0 \
            -isysroot "$SDK" \
            -framework Foundation \
            -framework UIKit \
            -framework CoreFoundation \
            SpringBoardBridge/OITBridge.m \
            -o "$RUNNER_TEMP/OpaqueIconThemerBridge.dylib"

          codesign -f -s - "$RUNNER_TEMP/OpaqueIconThemerBridge.dylib"

          mkdir -p "$RUNNER_TEMP/Bridge"
          cp "$RUNNER_TEMP/OpaqueIconThemerBridge.dylib" "$RUNNER_TEMP/Bridge/"
          cp SpringBoardBridge/OpaqueIconThemerBridge.plist "$RUNNER_TEMP/Bridge/"

          cd "$RUNNER_TEMP"
          zip -qry OpaqueIconThemerBridge.zip Bridge

      - uses: actions/upload-artifact@v4
        with:
          name: OpaqueIconThemer-IPA
          path: ${{ runner.temp }}/OpaqueIconThemer.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OpaqueIconThemer-SpringBoardBridge
          path: ${{ runner.temp }}/OpaqueIconThemerBridge.zip
