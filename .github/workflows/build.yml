name: Build OpaqueIconThemer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen dpkg

      - name: Generate project
        run: xcodegen generate

      - name: Build manager
        run: |
          set -euo pipefail
          xcodebuild \
            -project OpaqueIconThemer.xcodeproj \
            -scheme OpaqueIconThemer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Pack IPA
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry OpaqueIconThemer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OpaqueIconThemer-IPA
          path: ${{ runner.temp }}/OpaqueIconThemer.ipa
