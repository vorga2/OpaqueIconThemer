name: Build OpaqueIconThemer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen dpkg

      - name: Apply Liquid Glass UI fixes
        run: python3 Tools/patch_liquid_ui_rounding_unified_tint.py

      - name: Apply LunaPic-style global tint
        run: python3 Tools/apply_global_tint_ui.py

      - name: Apply layer-aware Apple Mono mask
        run: python3 Tools/patch_mono_layer_mask.py

      - name: Apply Apple Mono multilayer depth
        run: python3 Tools/patch_apple_mono_depth.py

      - name: Keep Apple Mono logo fill white
        run: python3 Tools/patch_apple_mono_white_fill.py

      - name: Remove Apple Mono outer gray outline
        run: python3 Tools/patch_mono_no_outline.py

      - name: Keep Apple Mono outer edge clean white
        run: python3 Tools/patch_mono_clean_outer_edge.py

      - name: Remove remaining Apple Mono rim at source
        run: python3 Tools/patch_mono_true_no_rim.py

      - name: Restrict Apple Mono shadows to interior
        run: python3 Tools/patch_mono_shadow_interior_only.py

      - name: Keep Tint+ strength on fill only
        run: python3 Tools/patch_tint_strength_fill_only.py

      - name: Lock Tint+ geometry to the detected mask
        run: python3 Tools/patch_tint_strength_geometry_lock.py

      - name: Fix Tint+ background edge and add icon gradient
        run: python3 Tools/patch_tint_background_edge_gradient.py

      - name: Remove every remaining Tint+ rim source
        run: python3 Tools/patch_remove_tint_rims.py

      - name: Force strict no-outline Tint+ final path
        run: python3 Tools/patch_force_outline_free_tint.py

      - name: Verify outline-free Tint+ is the runtime renderer
        run: python3 Tools/patch_wire_outline_free_tint.py

      - name: Apply Tint+ NoRim-4 final material pipeline
        run: python3 Tools/patch_tint_v4_no_rim_custom_gradient.py

      - name: Fix Smart Logo tint edge and add gradient toggle
        run: python3 Tools/patch_smart_logo_no_rim_gradient_toggle.py

      - name: Apply Smart Logo NR2 and refine Tint+ background detection
        run: python3 Tools/patch_smart_logo_v2_and_tint_bg_refine.py

      - name: Restore Tint shadows, add background gradient and 60Hz preview
        run: python3 Tools/patch_tint_shadows_bg_gradient_preview60_smart_v3.py

      - name: Apply fast live-preview source
        run: python3 Tools/patch_fast_live_preview.py

      - name: Restore visible foreground form shadows
        run: python3 Tools/patch_foreground_form_shadows.py

      - name: Apply requested default preset and Simple Tint rules
        run: python3 Tools/patch_default_preset_simple_global_tint.py

      - name: Add App Store ready-app browser
        run: python3 Tools/patch_appstore_browser.py

      - name: Fix live App Store icons and force UK catalog
        run: python3 Tools/patch_appstore_live_icon_refresh.py

      - name: Add custom icon import/edit/save
        run: python3 Tools/patch_custom_icon_editor.py

      - name: Generate project
        run: xcodegen generate

      - name: Build manager
        run: |
          set -euo pipefail
          xcodebuild \
            -project OpaqueIconThemer.xcodeproj \
            -scheme OpaqueIconThemer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            INFOPLIST_KEY_CFBundleVersion="$GITHUB_RUN_NUMBER" \
            build

      - name: Pack IPA
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry OpaqueIconThemer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OpaqueIconThemer-IPA
          path: ${{ runner.temp }}/OpaqueIconThemer.ipa
