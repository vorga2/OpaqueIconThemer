name: Patch icon shadows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-icon-shadows.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate shadow controls and renderer
        run: python3 Tools/patch_icon_shadows.py

      - name: Commit integrated shadows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-icon-shadows.yml Tools/patch_icon_shadows.py
          git add -A
          git commit -m 'Integrate configurable Apple-style icon shadows'
          git push origin HEAD:main
