name: Patch icon shadows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-icon-shadows.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate shadow controls and renderer
        shell: bash
        run: |
          set -euo pipefail
          echo ' SUNvbG9yKGljb25UaW50Q29sb3IpLmRlc2NyaXB0aW9uCiAgICB9CiIiIi5yZXBsYWNlKCJVIFNOVSIuY2hhcnMoIiIpLCAiVUlDb2xvciIpLAogICAgIiIiICAgIHByaXZhdGUgdmFyIGljb25Db2xvcktleTogU3RyaW5nIHsKICAgICAgICBV \...TRUNCATED_FOR_BREVITY...' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Commit integrated shadows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-icon-shadows.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Integrate configurable Apple-style icon shadows'
          git push origin HEAD:main
